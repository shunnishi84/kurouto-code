<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄人コード</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="header">
  <div>
    <div class="title">玄人コード</div>
    <div class="subtitle">v0.2.0 (爺バージョン) &nbsp;—&nbsp; by 玄人 (じじい)</div>
  </div>
  <button id="theme-btn" title="ダーク/ライト切替">🌙</button>
</div>

<div id="messages">
  <div class="msg-kurouto">
    <span class="label">玄人</span>
    <span class="text">何でも聞いてみなさい。（ただし覚悟しなさい）</span>
  </div>
  <hr class="separator" />
</div>

<div id="input-area">
  <div id="input-row">
    <span class="prompt-sign">&gt;</span>
    <input id="user-input" type="text" placeholder="プロンプトを入力..." autocomplete="off" />
    <button id="send-btn">送信</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
