<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玄人コード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #d4d4d4;
      font-family: 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── ヘッダー ── */
    #header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    #header .title {
      font-size: 18px;
      font-weight: bold;
      color: #e8a020;
    }
    #header .subtitle {
      color: #555;
      font-size: 12px;
      margin-top: 2px;
    }

    /* ── メッセージ領域 ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: #1a1a1a; }
    #messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .separator {
      border: none;
      border-top: 1px solid #2e2e2e;
      margin: 12px 0;
    }

    /* ユーザーメッセージ */
    .msg-user {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
    }
    .msg-user .label {
      color: #ffffff;
      font-weight: bold;
      white-space: nowrap;
      min-width: 3em;
    }
    .msg-user .text {
      color: #c8c8c8;
      word-break: break-all;
    }

    /* 玄人メッセージ */
    .msg-kurouto {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
    }
    .msg-kurouto .label {
      color: #e8a020;
      font-weight: bold;
      white-space: nowrap;
      min-width: 3em;
    }
    .msg-kurouto .text {
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 思考中 */
    .msg-thinking {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 0;
      color: #555;
    }
    .msg-thinking .spinner {
      color: #e8a020;
      font-size: 16px;
      animation: spin-frames 0.8s steps(10, end) infinite;
    }
    @keyframes spin-frames {
      0%  { content: "⠋"; }
    }
    .spinner-char { display: inline-block; }

    /* ── 入力エリア ── */
    #input-area {
      border-top: 1px solid #333;
      padding: 12px 20px;
      flex-shrink: 0;
      background: #1a1a1a;
    }
    #input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #input-row .prompt-sign {
      color: #4ec9b0;
      font-size: 16px;
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 14px;
      caret-color: #e8a020;
    }
    #user-input::placeholder { color: #444; }
    #send-btn {
      background: #e8a020;
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #f0b030; }
    #send-btn:disabled { background: #444; color: #666; cursor: not-allowed; }

    /* 怒りメッセージ */
    .msg-angry {
      text-align: center;
      padding: 20px 10px;
      animation: angry-shake 0.4s ease;
    }
    .msg-angry .angry-text {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: bold;
      color: #ff3333;
      text-shadow: 0 0 12px rgba(255,50,50,0.7);
      display: block;
      line-height: 1.4;
    }
    .msg-angry .angry-sub {
      color: #884444;
      font-size: 12px;
      margin-top: 6px;
      display: block;
    }
    @keyframes angry-shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* コードブロック風表示 */
    .msg-kurouto .text pre {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px 12px;
      margin-top: 6px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
      color: #c8c8c8;
      white-space: pre;
    }

    /* モバイル */
    @media (max-width: 600px) {
      body { font-size: 13px; }
      #header { padding: 10px 14px 8px; }
      #messages { padding: 12px 14px; }
      #input-area { padding: 10px 14px; }
    }
  </style>
</head>
<body>

<div id="header">
  <div class="title">玄人コード</div>
  <div class="subtitle">v0.1.0 (爺バージョン) &nbsp;—&nbsp; by 玄人 (じじい)</div>
</div>

<div id="messages">
  <div class="msg-kurouto">
    <span class="label">玄人</span>
    <span class="text">何でも聞いてみなさい。（ただし覚悟しなさい）</span>
  </div>
  <hr class="separator" />
</div>

<div id="input-area">
  <div id="input-row">
    <span class="prompt-sign">&gt;</span>
    <input id="user-input" type="text" placeholder="プロンプトを入力..." autocomplete="off" />
    <button id="send-btn">送信</button>
  </div>
</div>

<script>
  // ======================================================
  // ★ API Gateway の URL をここに設定してください ★
  // 例: "https://xxxxxxxxxx.execute-api.ap-northeast-1.amazonaws.com/prod/rant"
  // ======================================================
  const API_URL = "https://kuejdkujf9.execute-api.ap-northeast-1.amazonaws.com/prod/rant";
  // ======================================================

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");

  let exchangeCount = 0;  // やり取り回数カウンター

  const SPINNER_FRAMES = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
  const THINKING_MSGS  = ["ふむ...", "考えておる...", "若いもんのことを思うと...", "ワシの時代はのう..."];

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSeparator() {
    const hr = document.createElement("hr");
    hr.className = "separator";
    messagesEl.appendChild(hr);
  }

  function addUserMessage(text) {
    const row = document.createElement("div");
    row.className = "msg-user";
    row.innerHTML = `<span class="label">あなた</span><span class="text">${escHtml(text)}</span>`;
    messagesEl.appendChild(row);
    addSeparator();
    scrollBottom();
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // 思考中アニメーション要素を追加して、削除用関数を返す
  function startThinking() {
    const row = document.createElement("div");
    row.className = "msg-thinking";

    const spinnerEl = document.createElement("span");
    spinnerEl.className = "spinner-char";
    spinnerEl.style.color = "#e8a020";

    const msgEl = document.createElement("span");

    row.appendChild(spinnerEl);
    row.appendChild(msgEl);
    messagesEl.appendChild(row);
    scrollBottom();

    let fi = 0, mi = 0;
    const timer = setInterval(() => {
      spinnerEl.textContent = SPINNER_FRAMES[fi % SPINNER_FRAMES.length];
      if (fi % 10 === 0) { msgEl.textContent = THINKING_MSGS[mi % THINKING_MSGS.length]; mi++; }
      fi++;
    }, 80);

    return () => { clearInterval(timer); row.remove(); };
  }

  // 怒りメッセージを表示
  function showAngryMessage() {
    addSeparator();
    const row = document.createElement("div");
    row.className = "msg-angry";
    row.innerHTML = `
      <span class="angry-text">バカモノ！<br>いつまでAIに頼ってるんだ！</span>
      <span class="angry-sub">— 玄人より渾身の一言 —</span>
    `;
    messagesEl.appendChild(row);
    addSeparator();
    scrollBottom();
  }

  // 説教をタイプライター表示（コードブロック対応）
  function typewriterRant(text, onDone) {
    addSeparator();
    const row = document.createElement("div");
    row.className = "msg-kurouto";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "玄人";
    const textEl = document.createElement("span");
    textEl.className = "text";
    row.appendChild(label);
    row.appendChild(textEl);
    messagesEl.appendChild(row);

    // コードブロック（#include などを含む）はpreタグで一括表示
    const codeMatch = text.match(/^([\s\S]*?)(#include[\s\S]+return 0;\n\})([\s\S]*)$/);
    if (codeMatch) {
      const before = codeMatch[1];
      const code   = codeMatch[2];
      const after  = codeMatch[3];
      const fullText = before + "\x00CODE\x00" + after;
      let i = 0;
      let codeInserted = false;
      function tick() {
        if (i >= fullText.length) { addSeparator(); scrollBottom(); if (onDone) onDone(); return; }
        const ch = fullText[i++];
        if (ch === "\x00" && fullText.slice(i, i+4) === "CODE") {
          i += 5; // skip "CODE\x00"
          const pre = document.createElement("pre");
          pre.textContent = code;
          textEl.appendChild(pre);
          codeInserted = true;
          scrollBottom();
          setTimeout(tick, 30);
          return;
        }
        if (ch === "\n") {
          textEl.appendChild(document.createTextNode("\n"));
        } else {
          const last = textEl.lastChild;
          if (last && last.nodeType === Node.TEXT_NODE && !codeInserted) {
            last.textContent += ch;
          } else {
            textEl.appendChild(document.createTextNode(ch));
            codeInserted = false;
          }
        }
        scrollBottom();
        const delay = "。、\n".includes(ch) ? 80 + Math.random() * 120 : 15 + Math.random() * 30;
        setTimeout(tick, delay);
      }
      tick();
      return;
    }

    // 通常テキスト
    let i = 0;
    function tick() {
      if (i >= text.length) { addSeparator(); scrollBottom(); if (onDone) onDone(); return; }
      const ch = text[i++];
      textEl.textContent += ch;
      scrollBottom();
      const delay = "。、\n".includes(ch)
        ? 80 + Math.random() * 120
        : 15 + Math.random() * 30;
      setTimeout(tick, delay);
    }
    tick();
  }

  async function send() {
    const prompt = inputEl.value.trim();
    if (!prompt) return;

    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    exchangeCount++;
    addUserMessage(prompt);

    const stopThinking = startThinking();

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, exchange_count: exchangeCount }),
      });
      const data = await res.json();
      stopThinking();
      typewriterRant(data.rant, () => {
        if (data.angry) showAngryMessage();
      });
    } catch (e) {
      stopThinking();
      typewriterRant("……ネットワークがつながらん。\nワシが若い頃はオフラインでも仕事をしたもんじゃ。\n根性が足りんのじゃ。");
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  inputEl.focus();
</script>
</body>
</html>
